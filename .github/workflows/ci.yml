name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install native Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python3 -m pip install PySide6==6.12.0 PyYAML==6.0.3 ruff==0.16.9
      - name: Python lint (syntax errors and pyflakes, see ruff.toml)
        run: ruff check .
      - name: Python byte-compile
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m compileall -q bin agent_desktop tests
      - name: QML and JavaScript syntax (qmllint from PySide6)
        # Syntax only: Quickshell and Omarchy types are not installed here, so
        # the other qmllint categories report unresolved types, not bugs.
        run: pyside6-qmllint --only-explicit-categories --syntax warning *.qml qml/*.qml qml/*.js tests/*.qml
      - run: ./tests/run
      - name: Native Qt rendering and settings navigation
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python3 tests/avatar-native.py
          python3 tests/settings-native.py
